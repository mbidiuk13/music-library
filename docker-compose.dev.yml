# Локальне середовище розробки: лише PostgreSQL.
# Аудіофайли зберігаються в справжньому AWS S3 (окремий dev-бакет, ключі — у .env).
# Запуск: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16
    container_name: music-library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music_library
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U music -d music_library']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
