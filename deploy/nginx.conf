# nginx на хост-машині: HTTPS (сертифікат Let's Encrypt від certbot) і reverse proxy на застосунок
# (контейнер app, опублікований на 127.0.0.1:4000 — deploy/docker-compose.prod.yml).
#
# deploy/deploy.sh копіює файл у /etc/nginx/sites-available/music-library, замінивши
# __DOMAIN__ на домен із змінної DOMAIN. Сертифікат лежить у /etc/letsencrypt/live/__DOMAIN__/.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Аудіофайл до 50 МБ (MAX_UPLOAD_MB) + поля форми; більший запит nginx відхиляє з 413.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки безпеки (CSP, HSTS тощо) встановлює сам застосунок (helmet).
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Час на завантаження великого файлу адміністратором у S3.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
